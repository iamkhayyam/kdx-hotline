[package]
name = "kdx-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KDX desktop client"

[lib]
name = "kdx_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kdx-client-core = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# OS credential store for Address Book passwords (macOS Keychain, Windows
# Credential Manager, Secret Service on Linux/BSD). Platform backends are
# target-gated inside keyring, so enabling all three is a no-op elsewhere.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
# Mock runtime, to test the per-window command ACL.
tauri = { version = "2", features = ["test"] }
