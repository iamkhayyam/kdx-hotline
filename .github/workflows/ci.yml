name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the trailing comment).

jobs:
  test:
    name: Test (workspace minus Tauri app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ci-${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-test-

      - name: Test
        run: cargo test --workspace --exclude kdx-client --locked

      # Report-only for now: not every crate is warning-free yet.
      - name: Clippy
        run: cargo clippy --workspace --exclude kdx-client --tests --locked

  tauri-check:
    name: Check the Tauri client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install GTK / WebKit development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ci-${{ runner.os }}-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-tauri-

      # Unit tests include the per-window command ACL check (mock runtime).
      - name: cargo test (kdx-client)
        run: cargo test -p kdx-client --locked

  webview:
    name: Webview JS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Syntax-check every module
        run: |
          for f in $(git ls-files 'apps/kdx-client/dist/js/*.js'); do
            node --check "$f"
          done

      - name: No unescaped interpolation into HTML
        run: node apps/kdx-client/scripts/check-escaping.mjs

      - name: Unit tests
        run: node --test apps/kdx-client/tests/*.test.mjs
