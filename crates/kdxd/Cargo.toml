[package]
name = "kdxd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KDX server daemon — early-2000s Hotline-style chat and file sharing over TLS 1.3"
authors = ["theusual"]
keywords = ["hotline", "chat", "file-sharing", "server", "tls"]
categories = ["network-programming", "command-line-utilities"]
readme = "../../README.md"

[dependencies]
kdx-protocol = { workspace = true }
kdx-crypto = { workspace = true }
kdx-server-core = { workspace = true }
kdx-storage = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
bytes = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
