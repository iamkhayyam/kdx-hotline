# KDX server configuration. Copy this file to kdxd.toml (or anywhere) and
# pass it as the first argument to the daemon:
#
#   kdxd kdxd.toml
#
# Every field shown here is the built-in default, so an empty file behaves
# identically — this file exists to document what can be tuned. Uncomment
# and change only what you need.
#
# Relative paths are resolved against the directory containing this file.
# For a service install (config in /etc/kdx) use absolute paths in the
# service's state directory, e.g. "/var/lib/kdx/kdx.db" (systemd) or
# "/var/kdx/kdx.db" (launchd).

# Address and port to listen on. KDX's traditional port is 10700.
bind = "0.0.0.0:10700"

# SQLite database path. Created automatically on first run.
database = "kdx.db"

# Directory where uploaded file bytes are stored. Created automatically.
files_root = "files"

# Idle session lifetime in seconds before the client must reauthenticate
# (1 to 2592000, i.e. 30 days).
session_ttl_secs = 1800

# Per-transfer throttle in bytes/sec. 0 = unlimited.
max_upload_bytes_per_sec = 0
max_download_bytes_per_sec = 0

# Display name (1-64 bytes) and one-line description (up to 1024 bytes)
# advertised to the tracker directory.
server_name = "KDX Server"
server_description = ""

# Advertised capacity, shown as "users/max" in the tracker directory.
max_users = 256

# Connection limits. A connection that has not finished its TLS handshake
# within tls_handshake_timeout_secs is dropped; connections over
# max_connections (in total) or max_connections_per_ip (per IPv4 address
# or IPv6 /64) are closed as soon as they are accepted.
tls_handshake_timeout_secs = 10
max_connections = 1024
max_connections_per_ip = 8

# Public host name clients should use to reach this server. When set, the
# server lists itself (under this name and its bound port) in its own
# tracker directory; when unset, it is not listed at all.
# public_host = "kdx.example.net"

# TLS certificate and private key (PEM). When omitted, a self-signed dev
# certificate is generated on first start and cached (owner-only) next to
# the database as dev-cert.der / dev-key.der, so the server keeps the same
# identity across restarts. That is fine for local testing only. Clients
# that pinned the dev cert will warn loudly if the key ever changes, so
# supply real certificates for any real deployment (keep the key file
# readable by the server user only):
#
# [tls]
# cert_pem = "/etc/kdx/cert.pem"
# key_pem  = "/etc/kdx/key.pem"
