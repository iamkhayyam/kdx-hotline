[workspace]
resolver = "2"
members = [
    "crates/kdx-protocol",
    "crates/kdx-crypto",
    "crates/kdx-server-core",
    "crates/kdx-storage",
    "crates/kdxd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/theusual/kdx-hotline"

[workspace.dependencies]
kdx-protocol = { path = "crates/kdx-protocol" }
kdx-crypto = { path = "crates/kdx-crypto" }
kdx-server-core = { path = "crates/kdx-server-core" }
kdx-storage = { path = "crates/kdx-storage" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
bytes = "1"
bitflags = "2"
crc32fast = "1"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
dashmap = "6"
bitvec = "1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
